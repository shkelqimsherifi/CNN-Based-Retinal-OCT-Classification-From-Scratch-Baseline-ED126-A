<svg viewBox="0 0 750 860" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="748" height="858" fill="white"/>

  <!-- Outer dashed frame -->
  <rect x="6" y="6" width="738" height="848" rx="14" fill="none" stroke="#333" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="18" y="27" font-size="14" fill="#222">ED126 App (Inference)</text>

  <!-- START -->
  <circle cx="360" cy="55" r="9" fill="#4b4e91"/>
  <text x="360" y="42" font-size="12" text-anchor="middle" fill="#222">START</text>
  <line x1="360" y1="64" x2="360" y2="88" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box: Launch ED126 application -->
  <rect x="225" y="88" width="270" height="46" rx="8" fill="#4b4e91"/>
  <text x="360" y="116" font-size="13.5" text-anchor="middle" fill="white">Launch ED126 application</text>
  <line x1="360" y1="134" x2="360" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box: Choose model -->
  <rect x="225" y="158" width="270" height="46" rx="8" fill="#4b4e91"/>
  <text x="360" y="186" font-size="13.5" text-anchor="middle" fill="white">Choose model (e.g., ED126)</text>
  <line x1="360" y1="204" x2="360" y2="222" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 1: Model loaded successfully? -->
  <polygon points="360,222 472,262 360,302 248,262" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="257" font-size="12.5" text-anchor="middle" fill="#222">Model loaded</text>
  <text x="360" y="271" font-size="12.5" text-anchor="middle" fill="#222">successfully?</text>

  <!-- No -> LOG box 1 -->
  <line x1="472" y1="262" x2="576" y2="262" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="253" font-size="12" fill="#222">No</text>
  <rect x="578" y="235" width="140" height="52" rx="8" fill="#7a2020"/>
  <text x="648" y="257" font-size="13" text-anchor="middle" fill="white">LOG: Model load</text>
  <text x="648" y="273" font-size="13" text-anchor="middle" fill="white">failed</text>

  <line x1="648" y1="287" x2="648" y2="303" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Return to choose model -->
  <rect x="578" y="303" width="140" height="52" rx="8" fill="#595959"/>
  <text x="648" y="325" font-size="13" text-anchor="middle" fill="white">Return to choose</text>
  <text x="648" y="341" font-size="13" text-anchor="middle" fill="white">model</text>

  <!-- loop back to choose model box -->
  <path d="M718,329 L732,329 L732,181 L497,181" fill="none" stroke="#4b4e91" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes -> down to Load image box -->
  <text x="335" y="317" font-size="12" fill="#222">Yes</text>
  <line x1="360" y1="302" x2="360" y2="326" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Box: Load image to classify -->
  <rect x="200" y="326" width="320" height="46" rx="8" fill="#4b4e91"/>
  <text x="360" y="354" font-size="13.5" text-anchor="middle" fill="white">Load image to classify (browse/upload)</text>
  <line x1="360" y1="372" x2="360" y2="392" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Diamond 2: Image valid? -->
  <polygon points="360,392 492,432 360,472 228,432" fill="white" stroke="#333" stroke-width="1.5"/>
  <text x="360" y="427" font-size="12.5" text-anchor="middle" fill="#222">Image valid?</text>
  <text x="360" y="441" font-size="12.5" text-anchor="middle" fill="#222">(RGB, readable)</text>

  <!-- No -> LOG box 2 -->
  <line x1="492" y1="432" x2="576" y2="432" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="423" font-size="12" fill="#222">No</text>
  <rect x="578" y="406" width="140" height="52" rx="8" fill="#7a2020"/>
  <text x="648" y="428" font-size="13" text-anchor="middle" fill="white">LOG: Invalid</text>
  <text x="648" y="444" font-size="13" text-anchor="middle" fill="white">image</text>

  <line x1="648" y1="458" x2="648" y2="474" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Return to load image -->
  <rect x="578" y="474" width="140" height="52" rx="8" fill="#595959"/>
  <text x="648" y="496" font-size="13" text-anchor="middle" fill="white">Return to load</text>
  <text x="648" y="512" font-size="13" text-anchor="middle" fill="white">image</text>

  <!-- loop back to load image box -->
  <path d="M718,500 L732,500 L732,349 L524,349" fill="none" stroke="#4b4e91" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Yes -> down-left to classification chain -->
  <path d="M228,432 L155,432 L155,458" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="424" font-size="12" fill="#222">Yes</text>

  <!-- Teal chain -->
  <rect x="20" y="458" width="270" height="42" rx="8" fill="#1a5c4a"/>
  <text x="155" y="484" font-size="13" text-anchor="middle" fill="white">Run classification / prediction</text>
  <line x1="155" y1="500" x2="155" y2="522" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="522" width="270" height="42" rx="8" fill="#1a5c4a"/>
  <text x="155" y="548" font-size="13" text-anchor="middle" fill="white">Show prediction in percentage</text>
  <line x1="155" y1="564" x2="155" y2="586" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="586" width="270" height="42" rx="8" fill="#1a5c4a"/>
  <text x="155" y="612" font-size="13" text-anchor="middle" fill="white">Show disease description</text>
  <line x1="155" y1="628" x2="155" y2="650" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="650" width="270" height="42" rx="8" fill="#1a5c4a"/>
  <text x="155" y="676" font-size="13" text-anchor="middle" fill="white">Open "Treatment" tab</text>
  <line x1="155" y1="692" x2="155" y2="714" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="714" width="270" height="42" rx="8" fill="#1a5c4a"/>
  <text x="155" y="740" font-size="13" text-anchor="middle" fill="white">Display suggested remedy</text>
  <line x1="155" y1="756" x2="155" y2="778" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- END -->
  <circle cx="155" cy="792" r="10" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="155" cy="792" r="4" fill="#333"/>
  <text x="155" y="815" font-size="12" text-anchor="middle" fill="#222">END</text>
</svg>
